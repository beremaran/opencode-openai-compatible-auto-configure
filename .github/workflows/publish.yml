name: Publish to npm

on:
  push:
    tags:
      - "v*"
  # Allow re-running a publish for an existing tag (e.g. after a transient
  # failure). The tag ref must be supplied explicitly; every verification step
  # below still runs against that tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v1.2.3)"
        required: true
        type: string

# Minimal explicit permissions for this workflow:
#   contents: write - softprops/action-gh-release creates the GitHub Release
#   id-token: write - npm publish uses it for provenance attestation
permissions:
  contents: write
  id-token: write

# Serialize publishes of the same tag (push-tag or manual dispatch) and never
# cancel a publish already in progress.
concurrency:
  group: npm-publish-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # Effective release tag: the pushed tag on tag pushes, or the manually
  # supplied tag on workflow_dispatch.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  guard:
    name: Guard release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On push-tag runs github.ref is already the tag; on workflow_dispatch
          # the tag comes from the required input.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Verify tag is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG" || {
            echo "::error::RELEASE_TAG is empty; cannot guard an untagged release." >&2
            exit 1
          }
          git fetch origin "$DEFAULT_BRANCH" --tags --force
          if ! git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag $RELEASE_TAG is not an ancestor of the default branch ($DEFAULT_BRANCH); refusing to publish a tag created on a random branch." >&2
            exit 1
          fi
          echo "Tag $RELEASE_TAG is contained in $DEFAULT_BRANCH."

  publish:
    name: Publish
    needs: guard
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify package and release tag
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p 'require("./package.json").name')"
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          test "$PACKAGE_NAME" = "@beremaran/opencode-openai-compatible-auto-configure"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
          # A release tag must have a matching CHANGELOG entry. "Unreleased"
          # is never a tag, so the version here is always concrete. The `[?`
          # tolerates the bracketed keep-a-changelog form ("## [1.2.3]").
          grep -qE "^## \[?$PACKAGE_VERSION\]?" CHANGELOG.md || {
            echo "CHANGELOG.md has no entry for $PACKAGE_VERSION" >&2
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Inspect package contents
        run: |
          # Assert the packed tarball contains exactly the expected files.
          # npm always includes README.md, LICENSE, package.json, and the main
          # entry; the package.json "files" allow-list adds src/ and
          # CHANGELOG.md. Keep this list in sync with `npm pack --dry-run --json`
          # output.
          npm pack --dry-run --json > pack-info.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs"
            const [entry] = JSON.parse(readFileSync("pack-info.json", "utf8"))
            const actual = entry.files.map((f) => f.path).sort()
            const expected = [
              "CHANGELOG.md", "LICENSE", "README.md", "package.json",
              "src/commands.ts", "src/env.ts", "src/index.ts", "src/log.ts",
              "src/models.ts", "src/options.ts", "src/store.ts", "src/types.ts",
              "src/v1.ts", "src/v2.ts",
            ].sort()
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
              console.error("packed file mismatch")
              console.error("expected: " + expected.join(", "))
              console.error("actual:   " + actual.join(", "))
              process.exit(1)
            }
          '

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Smoke-test packed tarball
        run: |
          # Install the tarball in a clean consumer and import it by package
          # name with Bun. opencode itself loads plugins with Bun, so this is
          # the most faithful smoke test and avoids Node's type-stripping
          # restriction for .ts files under node_modules
          # (ERR_UNSUPPORTED_NODE_MODULES_TYPE_STRIPPING): Bun natively runs
          # the raw .ts entrypoints. The root import is the OpenCode 2 object;
          # ./server remains the callable OpenCode 1 entrypoint.
          REPO_ROOT="$PWD"
          TARBALL="$(npm pack --silent)"
          CONSUMER_DIR="$(mktemp -d)"
          cd "$CONSUMER_DIR"
          npm init -y
          npm install "$REPO_ROOT/$TARBALL"
          bun -e "const v2 = await import('@beremaran/opencode-openai-compatible-auto-configure'); if (v2.default?.id !== '@beremaran/opencode-openai-compatible-auto-configure' || typeof v2.default?.setup !== 'function') process.exit(1); const v1 = await import('@beremaran/opencode-openai-compatible-auto-configure/server'); if (typeof v1.default !== 'function') process.exit(1)"

      - name: Extract CHANGELOG section for release body
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # $ is intentional inside the single-quoted Node script
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs"
            const version = process.env.RELEASE_TAG.replace(/^v/, "")
            const text = readFileSync("CHANGELOG.md", "utf8")
            // Matches both "## [1.2.3] - 2026-08-04" and "## 1.2.3 - 2026-08-04".
            const re = new RegExp("^## \\[?" + version + "\\]?", "m")
            const match = re.exec(text)
            if (!match) {
              console.error(`no CHANGELOG section for ${version}`)
              process.exit(1)
            }
            // Skip the full heading line (e.g. "## [0.1.0] - 2026-08-06").
            const lineEnd = text.indexOf("\n", match.index)
            const from = lineEnd === -1 ? text.length : lineEnd + 1
            const next = text.indexOf("\n## ", from)
            const section = (next === -1 ? text.slice(from) : text.slice(from, next)).trim()
            writeFileSync("/tmp/release-body.md", section + "\n")
          '

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Try npm publish with either NPM_TOKEN or npm trusted publishing.
          # Before trusted publishing is configured, an auth rejection is a
          # graceful skip so the GitHub Release and tarball are still created.
          set +e
          OUTPUT="$(npm publish --provenance 2>&1)"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            printf '%s\n' "$OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$OUTPUT" | grep -qE "npm error code E(401|403|404)"; then
            printf '%s\n' "$OUTPUT"
            echo "::notice::npm publish was skipped: npm rejected authentication/authorization with E401/E403/E404. Configure trusted publishing or add an authorized NPM_TOKEN (see RELEASING.md)."
            exit 0
          fi
          printf '%s\n' "$OUTPUT" >&2
          exit "$STATUS"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: /tmp/release-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
